<!DOCTYPE html>
<html>
<head>
    <title> Registration Form </title>
</head>
<style>
    .container {
        background-color: #dfc5fe;
        border-width: 1px;
        border-radius: 5px;
        border-color: #7851a9;
        margin: auto;
        max-width: 450px;
        padding: 30px;

    }

    body {
        background-image: url("https://i.pinimg.com/1200x/65/b2/cd/65b2cdea35b6d368f88251203a1034ac.jpg");
    }








</style>
<body>
<div class="container">
<form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="f4e2cde0-0458-4133-ae2b-5dd2593c414d">

  <h1 align="center">Registration Form</h1>

    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" placeholder="Enter your full name" required>

    <br><br>

    <label for="email">Email Address:</label>
    <br><br>
    <input type="email" id="email" placeholder="student@example.com" required>
    
    <br><br>
    <label for="password">Password:</label>
    <br><br>
    <input type="password" name="password" id="password" placeholder="Type a password" required>

    <br><br>
    <label for="radio">Gender</label>
    <br><br>
    <input type="radio" name="gender">Male</input>
    <br><br>
    <input type="radio" name="gender">Female</input>
    <br><br>
    <input type="radio" name="gender">Other</input>
    <br><br>
    <input type="radio" name="gender">Prefer not to say</input>


    <br><br>
    <label for="radio">Grade Level</label>
    <br><br>
    <input type="radio" name="grade">Grade 7</input>
    <br><br>
    <input type="radio" name="grade">Grade 8</input>
    <br><br>
    <input type="radio" name="grade">Grade 9</input>
    <br><br>
    <input type="radio" name="grade">Grade 10</input>
    
    <br><br>
    <label for="interests">Interests</label>
    <br><br>
    <input type="checkbox" name="interest">Web Design</input>
    <br><br>
    <input type="checkbox" name="interest">Programming</input>
    <br><br>
    <input type="checkbox" name="interest">Robotics</input>
    <br><br>
    <button type="submit">Submit</button>
</form>
</div>
</body>
</html>
